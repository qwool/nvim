bind=ALT+SHIFT,s,spawn_shell,~/bin/screenshot edit --notify
bind=NONE,Print,spawn,~/bin/screenshot region --notify
bind=CTRL,Print,spawn,~/bin/screenshot screen --notify
bind=SUPER,n,spawn,makoctl dismiss 1

# reload config
bind=SUPER,r,reload_config

bind=ALT,space,spawn,rofi -show drun
bind=SUPER,d,spawn,foot --app-id otter-launcher -t foot otter-launcher
# bind=SUPER,space,spawn,foot --app-id otter-launcher -t foot otter-launcher app
bind=SUPER,Return,spawn,foot

# exit
bind=SUPER+SHIFT,q,quit
bind=SUPER,q,killclient,

# switch window focus
# bind=SUPER,j,focusstack,next
# bind=SUPER,k,focusstack,prev
# bind=SUPER+SHIFT,j,exchange_stack_client,next
# bind=SUPER+SHIFT,k,exchange_stack_client,prev

bind=none,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=none,XF86AudioLowerVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-
bind=none,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=none,XF86Favorites,spawn,playerctl play-pause

bind=none,XF86MonBrightnessUp,spawn,light -A 7
bind=none,XF86MonBrightnessDown,spawn,light -U 7

bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left

# switch window status
# bind=SUPER,g,toggleglobal,
bind=SUPER,Tab,spawn,~/.config/mango/alt-tab.sh
bind=ALT,Tab,focuslast,
# bind=SUPER,Tab,toggleoverview,
bind=SUPER,v,togglefloating,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
# bind=SUPER+SHIFT,f,togglefakefullscreen,
# bind=SUPER,i,minimized,
# bind=SUPER,o,toggleoverlay,
# bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER,z,toggle_scratchpad

# scroller layout
bind=SUPER,e,set_proportion,0.3
bind=SUPER,x,switch_proportion_preset,

# switch layout
bind=SUPER,n,switch_layout
bind=SUPER,s,switch_layout

# tag switch
# bind=SUPER,Left,viewtoleft,0
# bind=CTRL,Left,viewtoleft_have_client,0
# bind=SUPER,Right,viewtoright,0
# bind=CTRL,Right,viewtoright_have_client,0
# bind=CTRL+SUPER,Left,tagtoleft,0
# bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=SUPER,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# monitor switch
bind=SUPER,P,focusmon,up
bind=SUPER+SHIFT,p,tagmon,up
# bind=SUPER+shift,Left,focusmon,left
# bind=SUPER+SUPER,Right,tagmon,right

# gaps
# bind=SUPER+SHIFT,X,incgaps,1
# bind=SUPER+SHIFT,Z,incgaps,-1
# bind=SUPER+SHIFT,R,togglegaps

# movewin
bind=SUPER+ALT,k,movewin,+0,-50
bind=SUPER+ALT,j,movewin,+0,+50
bind=SUPER+ALT,h,movewin,-50,+0
bind=SUPER+ALT,l,movewin,+50,+0

# resizewin
# bind=CTRL+ALT,Up,resizewin,+0,-50
# bind=CTRL+ALT,Down,resizewin,+0,+50
# bind=CTRL+ALT,Left,resizewin,-50,+0
# bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER,LEFT,viewtoleft_have_client
axisbind=SUPER,RIGHT,viewtoright_have_client

# gestures
# gesturebind=none,up,3,focusdir,up
# gesturebind=none,down,3,focusdir,down
# gesturebind=none,down,4,toggleoverview,1
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
# gesturebind=none,left,3,viewtoleft_have_client
# gesturebind=none,right,3,viewtoright_have_client
gesturebind=none,up,3,toggleoverview,1
gesturebind=none,down,3,toggleovervew,1
